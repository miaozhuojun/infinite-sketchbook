version: 2
updates:
  - package-ecosystem: npm
    directory: /engine
    schedule:
      interval: weekly
    groups:
      remotion:
        patterns: ["remotion", "@remotion/*"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
